version: '3.8'
services:
  postgres-users:
    image: postgres:15
    environment:
      POSTGRES_DB: taxi_users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_users:/var/lib/postgresql/data

  postgres-trips:
    image: postgres:15
    environment:
      POSTGRES_DB: taxi_trips
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pg_trips:/var/lib/postgresql/data

  postgres-notifications:
    image: postgres:15
    environment:
      POSTGRES_DB: taxi_notifications
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pg_notif:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  user-service:
    build: ./user-service
    ports:
      - "8081:8081"
    depends_on:
      - postgres-users
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-users:5432/taxi_users
      SPRING_REDIS_HOST: redis

  trip-service:
    build: ./trip-service
    ports:
      - "8082:8082"
    depends_on:
      - postgres-trips
      - user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-trips:5432/taxi_trips

  notification-service:
    build: ./notification-service
    ports:
      - "8083:8083"
    depends_on:
      - postgres-notifications
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notifications:5432/taxi_notifications

volumes:
  pg_users:
  pg_trips:
  pg_notif: